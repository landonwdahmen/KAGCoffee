name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
      - run: flutter pub get
      # Existing informational lints remain visible; errors and warnings fail CI.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
